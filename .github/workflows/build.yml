name: CI & Release

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable   # floats with dotnet 10.0.x; pin both if a release breaks

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # MAUI workloads, not the bare platform ones: restore evaluates every TFM, including the
      # plain net10.0 reference target, and UseMaui needs the MAUI packs there too.
      - name: Install MAUI workloads
        run: dotnet workload install maui-ios maui-android

      - name: Show toolchain
        run: |
          dotnet --info
          dotnet workload list
          xcodebuild -version

      # Builds all TFMs (net10.0, net10.0-android, net10.0-ios). GeneratePackageOnBuild is
      # turned off so CI builds don't produce packages; the publish job packs explicitly.
      - name: Build
        run: dotnet build src/Nkraft.Mopups.csproj -c Release -p:GeneratePackageOnBuild=false

  publish:
    runs-on: macos-26
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    environment: nuget-deployment
    permissions:
      contents: read
      id-token: write   # trusted publishing (OIDC); scoped to this job only
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches csproj Version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJ=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Nkraft.Mopups.csproj | head -1)
          if [ "$TAG" != "$PROJ" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match csproj Version $PROJ"
            exit 1
          fi

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workloads
        run: dotnet workload install maui-ios maui-android

      - name: Pack
        run: dotnet pack src/Nkraft.Mopups.csproj --configuration Release --output ./nupkg -p:GeneratePackageOnBuild=false

      - name: Verify package contents
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="./nupkg/Nkraft.Mopups.$VERSION.nupkg"
          SYM="./nupkg/Nkraft.Mopups.$VERSION.snupkg"
          [ -f "$PKG" ] || { echo "::error::$PKG not found"; ls ./nupkg; exit 1; }
          [ -f "$SYM" ] || { echo "::error::$SYM not found"; ls ./nupkg; exit 1; }

          CONTENTS=$(unzip -l "$PKG")
          echo "$CONTENTS"
          for path in \
            lib/net10.0/Nkraft.Mopups.dll \
            lib/net10.0-android \
            lib/net10.0-ios \
            README.md \
            LICENSE
          do
            echo "$CONTENTS" | grep -q "$path" || { echo "::error::Package is missing $path"; exit 1; }
          done

          NUSPEC=$(unzip -p "$PKG" '*.nuspec')
          echo "$NUSPEC"
          for dep in Microsoft.Maui.Controls Nkraft.CrossUtility; do
            echo "$NUSPEC" | grep -q "id=\"$dep\"" || { echo "::error::nuspec missing dependency $dep"; exit 1; }
          done

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # The matching .snupkg next to the .nupkg is pushed automatically.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "./nupkg/Nkraft.Mopups.${GITHUB_REF_NAME#v}.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate